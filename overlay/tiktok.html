<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TikTok Flag Game</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tiktok.css">

</head>

<body>

    <div id="topSafeArea"></div>

<div id="app">

    <header id="header">

        <div id="titleArea">

            <h1 id="gameTitle">
                🌎 WORLD FLAG BATTLE
            </h1>

            <span id="gameSubtitle">
                Elige tu país favorito
            </span>

        </div>

        <div id="goalCard">

            <span>🎯 Objetivo</span>

            <strong id="goalValue">
                100%
            </strong>

        </div>

    </header>

    <main id="mainLayout">

        <section id="countriesGrid">

            <!-- Las tarjetas se crean automáticamente -->

        </section>

        <aside id="sidebar">

            <section id="rankingPanel">

                <h2>🏆 Top MVPs</h2>

                <ol id="rankingList"></ol>

            </section>

        </aside>

    </main>

    <footer id="giftArea">

        <div id="giftNotification">

            Esperando regalos...

        </div>

    </footer>

</div>

<div id="effectsContainer"></div>

<script src="/socket.io/socket.io.js"></script>

<script src="js/socket.js"></script>
<script src="js/countries.js"></script>
<script src="js/ranking.js"></script>
<script src="js/notifications-tiktok.js"></script>

</body>

</html>
